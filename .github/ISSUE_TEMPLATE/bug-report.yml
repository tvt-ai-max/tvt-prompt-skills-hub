name: 🐞 Báo lỗi
description: Lỗi giao diện, copy/export hoặc nội dung sai.
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: url
    attributes:
      label: Trang gặp lỗi
      placeholder: "https://hub.toilatung.com/items/…"
  - type: textarea
    id: what
    attributes:
      label: Mô tả lỗi & các bước tái hiện
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Trình duyệt / thiết bị / theme (Sáng/Tối)
